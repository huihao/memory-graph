<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#4A90E2" rx="16"/>
  
  <!-- Network/Graph Symbol -->
  <!-- Edges (lines between nodes) -->
  <line x1="64" y1="32" x2="32" y2="64" stroke="white" stroke-width="4"/>
  <line x1="64" y1="32" x2="96" y2="64" stroke="white" stroke-width="4"/>
  <line x1="32" y1="64" x2="64" y2="96" stroke="white" stroke-width="4"/>
  <line x1="96" y1="64" x2="64" y2="96" stroke="white" stroke-width="4"/>
  
  <!-- Nodes (circles) -->
  <circle cx="64" cy="32" r="12" fill="white" stroke="#2E5C8A" stroke-width="2"/>
  <circle cx="32" cy="64" r="12" fill="white" stroke="#2E5C8A" stroke-width="2"/>
  <circle cx="96" cy="64" r="12" fill="white" stroke="#2E5C8A" stroke-width="2"/>
  <circle cx="64" cy="96" r="12" fill="white" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Text -->
  <text x="64" y="118" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">MG</text>
</svg>
