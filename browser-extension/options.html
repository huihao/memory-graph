<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Memory Graph Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .option-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Memory Graph Settings</h1>
    
    <div class="option-group">
        <label for="backendUrl">Backend API URL:</label>
        <input type="url" id="backendUrl" placeholder="http://localhost:8000">
        <p style="font-size: 12px; color: #666;">
            Enter the URL of your Memory Graph backend server
        </p>
    </div>
    
    <div class="option-group">
        <label for="apiKey">OpenAI API Key (optional):</label>
        <input type="text" id="apiKey" placeholder="sk-...">
        <p style="font-size: 12px; color: #666;">
            Optional: Enter your OpenAI API key for enhanced article analysis
        </p>
    </div>
    
    <button id="save">Save Settings</button>
    
    <div class="status" id="status">
        Settings saved successfully!
    </div>
    
    <script src="options.js"></script>
</body>
</html>
